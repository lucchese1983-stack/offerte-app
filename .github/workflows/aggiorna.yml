name: Aggiorna Offerte

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests beautifulsoup4
      - run: |
          python -c "
          import json, datetime
          data = {
              'last_updated': datetime.datetime.now().strftime('%d/%m/%Y %H:%M'),
              'deals': [
                  {'id': 1, 'title': 'Smart TV 55 OLED 4K', 'price': '399€', 'oldPrice': '1299€', 'discount': '-69%', 'marketplace': 'Amazon', 'trustScore': 98, 'errorType': 'Errore di Prezzo', 'category': 'Tecnologia'},
                  {'id': 2, 'title': 'Notebook Gaming i7', 'price': '899€', 'oldPrice': '1250€', 'discount': '-28%', 'marketplace': 'eBay', 'trustScore': 92, 'errorType': 'Nessun errore', 'category': 'Informatica'}
              ]
          }
          with open('deals.json', 'w') as f:
              json.dump(data, f)
          "
      - name: Commit and push changes
        run: |
          git config --global user.name "Bot Offerte"
          git config --global user.email "bot@github.com"
          git add deals.json
          git commit -m "Offerte aggiornate" || exit 0
          git push origin main
