<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PricePulse & DealScout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 p-2 rounded-xl text-white">
                    <i data-lucide="zap" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-white">PricePulse & DealScout</h1>
                    <p class="text-xs text-slate-400" id="last-update">Aggiornamento in corso...</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        <div class="mb-6">
            <h2 class="text-2xl font-bold text-white mb-2">Offerte in Evidenza & Errori di Prezzo</h2>
            <p class="text-slate-400 text-sm">Scansione automatica dei marketplace e analisi affidabilità siti.</p>
        </div>

        <!-- Deals Grid -->
        <div id="deals-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- I dati verranno caricati qui automaticamente -->
            <div class="p-6 bg-slate-900 border border-slate-800 rounded-2xl text-center text-slate-400 col-span-full">
                Caricamento offerte dal cloud...
            </div>
        </div>
    </main>

    <script>
        async function caricaOfferteCloud() {
            try {
                const response = await cachingBust = await fetch('deals.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error("File deals.json non ancora disponibile");
                const data = await response.json();
                
                document.getElementById('last-update').innerText = "Ultimo aggiornamento: " + data.last_updated;
                
                const container = document.getElementById('deals-container');
                container.innerHTML = '';

                data.deals.forEach(deal => {
                    const card = document.createElement('div');
                    card.className = "bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between hover:border-indigo-500/50 transition-all shadow-xl";
                    card.innerHTML = `
                        <div>
                            <div class="flex justify-between items-start mb-3">
                                <span class="px-2.5 py-1 bg-indigo-500/10 text-indigo-400 text-xs font-semibold rounded-lg border border-indigo-500/20">${deal.category}</span>
                                <span class="px-2.5 py-1 bg-emerald-500/10 text-emerald-400 text-xs font-semibold rounded-lg border border-emerald-500/20">${deal.discount}</span>
                            </div>
                            <h3 class="font-semibold text-white text-lg mb-2">${deal.title}</h3>
                            <div class="flex items-baseline space-x-2 mb-4">
                                <span class="text-2xl font-bold text-white">${deal.price}</span>
                                <span class="text-sm text-slate-500 line-through">${deal.oldPrice}</span>
                            </div>
                        </div>
                        <div class="pt-4 border-t border-slate-800/80 flex items-center justify-between text-xs text-slate-400">
                            <span>Marketplace: <strong class="text-slate-200">${deal.marketplace}</strong></span>
                            <span class="text-emerald-400 font-medium">Trust: ${deal.trustScore}%</span>
                        </div>
                    `;
                    container.appendChild(card);
                });
                lucide.createIcons();
            } catch (err) {
                console.error(err);
            }
        }
        caricaOfferteCloud();
    </script>
</body>
</html>
